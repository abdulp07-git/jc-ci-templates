parameters:
  - name: AppName
    type: string
  - name: AppSourceDir
    type: string

steps:
  - script: |
      az login --identity
      az acr login --name $(AcrName)
    displayName: 'ACR Login'
    
  - task: trivy@2
    name: TrivyRepo
    displayName: 'Trivy Repo Scan'
    inputs:
      version: 'latest'
      type: 'filesystem'
      target: '.'
      scanners: 'misconfig,vuln,secret'
      ignoreUnfixed: true
      ignoreScanErrors: true
      reports: 'junit,html'
      publish: true

  - task: trivy@2
    name: TrivyDocker
    displayName: 'Trivy Docker Scan'
    inputs:
      version: 'latest'
      type: 'image'
      target: $(AcrName)/${{ parameters.AppName }}:$(Build.BuildNumber)
      scanners: 'misconfig,vuln,secret'
      ignoreUnfixed: true
      ignoreScanErrors: true
      reports: 'junit,html'
      publish: true

  # Publish JUnit test results
  - task: PublishTestResults@2
    displayName: 'Publish Repo Scan Results'
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: |
        $(TrivyRepo.junitReport)
      searchFolder: '$(Agent.TempDirectory)'
      testRunTitle: 'Trivy Repo Scan'
      publishRunAttachments: false

  - task: PublishTestResults@2
    displayName: 'Publish Docker Scan Results'
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: |
        $(TrivyDocker.junitReport)
      searchFolder: '$(Agent.TempDirectory)'
      testRunTitle: 'Trivy Docker Scan'
      publishRunAttachments: false

  # Publish HTML reports as build artifacts
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Repo HTML Report'
    inputs:
      pathToPublish: '$(TrivyRepo.htmlReport)'
      artifactName: 'trivy-repo-html-report'
      publishLocation: 'Container'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Docker HTML Report'
    inputs:
      pathToPublish: '$(TrivyDocker.htmlReport)'
      artifactName: 'trivy-docker-html-report'
      publishLocation: 'Container'

  # Optional: Copy reports to a more accessible location
  - task: CopyFiles@2
    displayName: 'Copy HTML Reports'
    inputs:
      sourceFolder: '$(Agent.TempDirectory)'
      contents: |
        $(TrivyRepo.htmlReport)
        $(TrivyDocker.htmlReport)
      targetFolder: '$(Build.ArtifactStagingDirectory)/trivy-reports'
      flattenFolders: false

  - task: PublishBuildArtifacts@1
    displayName: 'Publish All Trivy Reports'
    inputs:
      pathToPublish: '$(Build.ArtifactStagingDirectory)/trivy-reports'
      artifactName: 'trivy-security-reports'
      publishLocation: 'Container'