steps:
  - script: |
      mkdir -p $(Build.SourcesDirectory)/checkov-results
      checkov -d . \
        --framework terraform \
        --output cli \
        --output junitxml \
        --output-file $(Build.SourcesDirectory)/checkov-results/
      echo "Checkov scan complete."
    displayName: 'Run Checkov Scan'

  - task: PublishTestResults@2
    displayName: 'Publish Checkov JUnit Results'
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '$(Build.SourcesDirectory)/checkov-results/results_junitxml.xml'
      testRunTitle: 'Checkov IaC Security Scan'
    condition: succeededOrFailed()