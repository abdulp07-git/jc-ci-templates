steps:
  - script: |
      ls -ls
      echo ${ENV}
      mkdir -p $(Agent.TempDirectory)/checkov-docker-results
      checkov -d ${ENV} \
        --framework dockerfile \
        --output cli \
        --output junitxml \
        --output-file $(Agent.TempDirectory)/checkov-docker-results/
      echo "Checkov scan complete."
    env:
      DockerDir: '${{ parameters.AppSourceDir }}'
    displayName: 'Checkov Docker Scan'

  - task: PublishTestResults@2
    displayName: 'Publish Checkov Results'
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '$(Agent.TempDirectory)/checkov-docker-results/results_junitxml.xml'
      testRunTitle: 'Checkov Docker Security Scan'
    condition: succeededOrFailed()