parameters:
  - name: AppName
    type: string
  - name: AppSourceDir
    type: string

steps:
  - script: |
      mkdir -p $(Agent.TempDirectory)/checkov-docker-results/${{ parameters.AppName }}/$(Build.BuildId)
      checkov -d ${{ parameters.AppSourceDir }} \
        --framework dockerfile \
        --output cli \
        --output junitxml \
        --output-file $(Agent.TempDirectory)/checkov-docker-results/${{ parameters.AppName }}/$(Build.BuildId)/
      echo "Checkov scan complete."
    displayName: 'Checkov Docker Scan'

  - task: PublishTestResults@2
    displayName: 'Publish Checkov Results'
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '$(Agent.TempDirectory)/checkov-docker-results/${{ parameters.AppName }}/$(Build.BuildId)/results_junitxml.xml'
      testRunTitle: 'Checkov Docker Scan'
    condition: succeededOrFailed()