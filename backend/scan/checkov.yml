steps:
  - script: |
      ls - ls
      mkdir -p $(Build.SourcesDirectory)/checkov-docker-results
      checkov -d $(DockerDir) \
        --framework dockerfile \
        --output cli \
        --output junitxml \
        --output-file $(Build.SourcesDirectory)/checkov-docker-results/
      echo "Checkov scan complete."
    env:
      DockerDir: '${{ parameters.AppSourceDir }}'
    displayName: 'Checkov Docker Scan'

  - task: PublishTestResults@2
    displayName: 'Publish Checkov Results'
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '$(Build.SourcesDirectory)/checkov-docker-results/results_junitxml.xml'
      testRunTitle: 'Checkov Docker Security Scan'
    condition: succeededOrFailed()