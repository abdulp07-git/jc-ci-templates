parameters:
  - name: AppName
    type: string
  - name: AppSourceDir
    type: string
  - name: AppNamespace
    type: string

variables:
  - group: jc-infra-vars
  - name: AcrName
    value: jcapp2025.azurecr.io
  - name: DOCKER_BUILDKIT
    value: 1

stages:
  - stage: Build
    displayName: 'Build and Scan'
    jobs:
      - template: build-publish.yml
        parameters:
          AppName: '${{ parameters.AppName }}'
          AppSourceDir: '${{ parameters.AppSourceDir }}'
          AppNamespace: '${{ parameters.AppNamespace }}'

      - template: scan-analyse.yml
        parameters:
          AppName: '${{ parameters.AppName }}'
          AppSourceDir: '${{ parameters.AppSourceDir }}'

  - stage: Deploy_dev
    dependsOn: Build
    displayName: 'Deploy to Dev'
    jobs:
      - template: deploy.yml
        parameters:
          AppName: '${{ parameters.AppName }}'
          AppSourceDir: '${{ parameters.AppSourceDir }}'
          AppNamespace: '${{ parameters.AppNamespace }}'
          AksEnv: 'dev'

  - stage: Deploy_qa
    dependsOn: Deploy_dev
    displayName: 'Deploy to Qa'
    jobs:
      - template: deploy.yml
        parameters:
          AppName: '${{ parameters.AppName }}'
          AppSourceDir: '${{ parameters.AppSourceDir }}'
          AppNamespace: '${{ parameters.AppNamespace }}'
          AksEnv: 'qa'

  - stage: Deploy_prod
    dependsOn: Deploy_qa
    displayName: 'Deploy to Prod'
    jobs:
      - template: deploy.yml
        parameters:
          AppName: '${{ parameters.AppName }}'
          AppSourceDir: '${{ parameters.AppSourceDir }}'
          AppNamespace: '${{ parameters.AppNamespace }}'
          AksEnv: 'prod'