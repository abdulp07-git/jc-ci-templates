parameters:
  - name: AppName
    type: string
  - name: AppSourceDir
    type: string
  - name: DeployTo
    type: object
    default: [] 

variables:
  - group: jc-infra-vars
  - name: AcrName
    value: jcappacr2025.azurecr.io

stages:
  - stage: Build
    displayName: 'Build'
    jobs:
      - template: build-publish.yml
        parameters:
          AppName: '${{ parameters.AppName }}'
          AppSourceDir: '${{ parameters.AppSourceDir }}'
      - template: scan.yml
        parameters:
          AppName: '${{ parameters.AppName }}'
          AppSourceDir: '${{ parameters.AppSourceDir }}'
