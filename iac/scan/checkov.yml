steps:
  - script: |
      terraform show -json $(env).tfplan | jq > tfplan.json
      mkdir -p $(Build.SourcesDirectory)/checkov-results
      checkov -f tfplan.json \
        --repo-root-for-plan-enrichment $(System.DefaultWorkingDirectory)/root-hub/ \
        --deep-analysis \
        --output junitxml \
        --output-file $(Build.SourcesDirectory)/checkov-results/
      echo "Checkov scan complete."
    displayName: 'Run Checkov Scan'
    workingDirectory: 'root-hub'

  - task: PublishTestResults@2
    displayName: 'Publish Checkov JUnit Results'
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '$(Build.SourcesDirectory)/checkov-results/*.xml'
      testRunTitle: 'Checkov IaC Security Scan'
    condition: succeededOrFailed()