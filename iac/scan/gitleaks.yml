steps:
  - script: |
      mkdir -p $(Build.SourcesDirectory)/gitleaks
      gitleaks detect \
        --source="$(Build.SourcesDirectory)" \
        --report-format=junit \
        --report-path="$(Agent.BuildDirectory)/gitleaks-results" \
        --redact \
        --verbose
      echo "Gitleaks scan completed."
    displayName: 'Run GitLeaks Scan'

  - task: PublishTestResults@2
    displayName: 'Publish Gitleaks scan Results'
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '$(Agent.BuildDirectory)/gitleaks-results/*.xml'
      testRunTitle: 'Gitleaks scan'
    condition: succeededOrFailed()